<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TarkovLab | Coming Soon</title>
    <meta
      name="description"
      content="TarkovLab coming soon page for Escape from Tarkov."
    />
    <meta name="theme-color" content="#09100d" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --text: #ece7d6;
        --line-strong: rgba(186, 193, 170, 0.26);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        overflow: hidden;
        font-family: 'Rajdhani', sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at 50% 18%, rgba(156, 165, 94, 0.18), transparent 24%),
          linear-gradient(180deg, #0f1612 0%, #09100d 58%, #050706 100%);
      }

      .page-frame {
        position: fixed;
        inset: 18px;
        border-radius: 30px;
        border: 1px solid rgba(186, 193, 170, 0.08);
        pointer-events: none;
      }

      .noise {
        position: fixed;
        inset: 0;
        opacity: 0.08;
        background-image: radial-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 4px 4px;
        pointer-events: none;
      }

      .hero {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .hero-stack {
        display: grid;
        justify-items: center;
        gap: clamp(8px, 1.4vw, 16px);
        text-align: center;
        width: min(92vw, 720px);
      }

      .logo-shell {
        width: min(72vw, 520px);
        aspect-ratio: 1;
        display: grid;
        place-items: center;
        padding: 0;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
      }

      .logo-shell img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center;
      }

      .soon-copy {
        margin: 0;
        color: var(--text);
        font-family: 'Bebas Neue', sans-serif;
        font-size: clamp(30px, 4vw, 72px);
        line-height: 0.9;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      @media (max-width: 700px) {
        .page-frame {
          inset: 10px;
          border-radius: 22px;
        }

        .hero {
          padding: 18px;
        }

        .hero-stack {
          gap: 8px;
          width: min(94vw, 420px);
        }

        .logo-shell {
          width: min(84vw, 320px);
          border-radius: 0;
        }

        .soon-copy {
          font-size: clamp(24px, 8vw, 42px);
          letter-spacing: 0.14em;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-frame"></div>
    <div class="noise"></div>

    <main class="hero">
      <section class="hero-stack" aria-label="TarkovLab coming soon">
        <div class="logo-shell" aria-label="TarkovLab icon">
          <img src="/assets/logo.png" alt="TarkovLab icon" />
        </div>

        <p class="soon-copy">Coming Soon</p>
      </section>
    </main>
  </body>
</html>
