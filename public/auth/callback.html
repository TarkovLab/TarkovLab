<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Redirecting...</title>
<style>
body{background:#0a0a0a;color:#c8c3b6;font-family:'Rajdhani',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0}
.loading{text-align:center}
.loading span{display:inline-block;margin-top:12px;font-size:1.1rem;color:#8a8578}
</style>
</head>
<body>
<div class="loading">
  <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
    <circle cx="20" cy="20" r="18" stroke="#2a2825" stroke-width="3"/>
    <path d="M20 2a18 18 0 0 1 18 18" stroke="#9a8c5f" stroke-width="3" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 20 20" to="360 20 20" dur="1s" repeatCount="indefinite"/>
    </path>
  </svg>
  <span>Signing in with Google...</span>
</div>
<script>
(function() {
  var hash = window.location.hash.substring(1);
  var params = new URLSearchParams(hash);
  var accessToken = params.get('access_token');
  if (!accessToken) {
    window.location.href = '/auth/login?error=oauth';
    return;
  }
  fetch('/auth/callback', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ access_token: accessToken })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (data.ok) {
      window.location.href = '/settings';
    } else {
      window.location.href = '/auth/login?error=oauth';
    }
  })
  .catch(function() {
    window.location.href = '/auth/login?error=oauth';
  });
})();
</script>
</body>
</html>
